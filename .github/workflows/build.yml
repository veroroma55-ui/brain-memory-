name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Debug Keystore
        run: |
          echo "Checking debug.keystore status..."
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore successfully restored."
          elif [ -f "debug.keystore" ]; then
            echo "debug.keystore already present."
          else
            echo "Note: debug.keystore.base64 not found, Gradle will use default keystore."
          fi

      - name: Inspect Project Architecture & Assets
        run: |
          echo "Inspecting project type..."
          if [ -f "package.json" ]; then
            echo "Web project detected: installing dependencies and building..."
            npm ci
            npm run build
          else
            echo "Native Jetpack Compose Android application detected. All source code, assets, and database entities are native."
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Exists & Archive Integrity
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not found at expected path: $APK_PATH"
            exit 1
          fi
          echo "✅ APK file exists at: $APK_PATH"

          # Verify that it is a valid zip/APK archive
          unzip -tq "$APK_PATH"
          echo "✅ APK archive integrity verified."

      - name: Print APK Details (File Size, Package ID, Permissions)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          # Print file size
          FILE_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          FILE_BYTES=$(wc -c < "$APK_PATH")
          echo "📦 APK File Size: $FILE_SIZE ($FILE_BYTES bytes)"

          # Locate Android build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Print Package Name, Launch Activity, SDK Targets
          if [ -f "$BUILD_TOOLS_DIR/aapt2" ]; then
            echo "📋 Application Package Details:"
            "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" 2>/dev/null | grep -E "package:|launchable-activity:|sdkVersion:|targetSdkVersion:|uses-permission:" || true
          fi

          # Verify Signing Certificate with apksigner
          if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "🔐 Verifying APK Signatures (v1, v2, v3):"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
